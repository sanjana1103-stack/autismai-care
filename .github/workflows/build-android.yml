name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/autismai-care-foundation

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 9
        run: |
          corepack enable
          corepack prepare npm@9 --activate

      - name: Install dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Expo versions
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ls expo expo-router --depth=0 || true
          node -e "const p=require('./package.json'); if((p.dependencies && p.dependencies['expo-router']) !== '1.4.4'){ console.error('expo-router must remain 1.4.4'); process.exit(1); }"

      - name: Ensure eas.json
        working-directory: frontend
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); if(!fs.existsSync('eas.json')){ const cfg={build:{preview:{android:{buildType:'apk'}}}}; fs.writeFileSync('eas.json', JSON.stringify(cfg,null,2)); } console.log(fs.readFileSync('eas.json','utf8'));"

      - name: Install EAS CLI
        run: |
          npm install --global eas-cli@latest

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "ERROR: EXPO_TOKEN is missing."
            exit 1
          fi
          eas whoami

      - name: Run EAS build
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          echo "Starting EAS Android APK build..."
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > /tmp/eas_build_output.json
          echo "EAS build completed."
          node -e "const fs=require('fs'); const raw=fs.readFileSync('/tmp/eas_build_output.json','utf8'); let j; try{ j=JSON.parse(raw); }catch(e){ console.error('EAS output not JSON'); console.error(raw); process.exit(1);} const id=j.id || (j.result && j.result.id) || (j.build && j.build.id) || (j.builds && j.builds[0] && j.builds[0].id); if(!id){ console.error('No EAS build ID found'); console.error(JSON.stringify(j,null,2)); process.exit(1);} console.log('EAS BUILD ID:', id); fs.writeFileSync('/tmp/eas_build_id', id);"

      - name: Download APK
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/eas_build_id ]; then
            echo "ERROR: /tmp/eas_build_id not found"
            exit 1
          fi
          BUILD_ID=$(cat /tmp/eas_build_id)
          mkdir -p autismai-artifacts
          eas build:download --platform android --id "$BUILD_ID" --output ./autismai-artifacts
          APK_PATH=$(find ./autismai-artifacts -type f -name '*.apk' | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was downloaded."
            ls -la autismai-artifacts || true
            exit 1
          fi
          cp "$APK_PATH" ./autismai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autismai-care-android-apk
          path: frontend/autismai.apk
